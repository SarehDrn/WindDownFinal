name: CI

# Runs every test suite on every push (any branch) and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Cancel an older run on the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: winddown
          POSTGRES_PASSWORD: winddown
          POSTGRES_DB: winddown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winddown -d winddown"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    # Test-only values; nothing here is a real secret and backend/.env is never read.
    env:
      DJANGO_NO_DOTENV: "1"
      DJANGO_SECRET_KEY: test-only-insecure-secret-key
      DEBUG: "0"
      DATABASE_URL: postgres://winddown:winddown@localhost:5432/winddown
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -m "not integration"
      - name: Integration tests
        run: python -m pytest -m integration

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test

  docker-compose:
    name: docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
