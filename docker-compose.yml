services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: winddown
      POSTGRES_PASSWORD: winddown
      POSTGRES_DB: winddown
    ports:
      - "5433:5432"
    volumes:
      - winddown_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winddown -d winddown"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  winddown_pgdata:
